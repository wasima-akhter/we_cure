name: glady
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+6

environment:
  sdk: ^3.9.0

dependencies:
  # ============================================================
  # Flutter SDK
  # ============================================================

  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ============================================================
  # State Management & Local Storage
  # ============================================================

  get:
  get_storage:

  # ============================================================
  # UI / Design / Animations
  # ============================================================

  flutter_screenutil: ^5.9.3
  flutter_animate:
  shimmer:
  shadify: ^1.0.1
  loading_animation_widget:
  google_fonts:
  flutter_svg:
  photo_view: ^0.15.0
  custom_refresh_indicator: ^4.0.1
  device_preview: ^1.3.1

  # ============================================================
  # Forms & Input
  # ============================================================

  pin_code_fields: ^8.0.1
  pinput:

  # ============================================================
  # Networking / API
  # ============================================================

  http:
  dio:
  http_parser: ^4.0.2
  mime: ^1.0.4
  connectivity_plus:

  # ============================================================
  # Firebase
  # ============================================================

  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2

  # ============================================================
  # Local Notifications
  #
  # Using 20.1.0 because this project is currently Dart 3.9.
  # FLN 20.x supports Dart 3.8+.
  # ============================================================

  flutter_local_notifications: ^19.5.0

  # ============================================================
  # Authentication
  # ============================================================

  google_sign_in: ^6.3.0

  # ============================================================
  # Navigation / Deep Links / Web
  # ============================================================

  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0

  # ============================================================
  # Media / Images
  # ============================================================

  image_picker: ^1.2.1
  cached_network_image:
  flutter_image_compress: ^2.4.0

  # ============================================================
  # Real-Time Communication
  # ============================================================

  socket_io_client: ^3.1.3

  # ============================================================
  # Agora - Video / Voice / Chat
  # ============================================================

  # Latest stable Agora RTC
  agora_rtc_engine: ^6.5.4

  # Latest stable Agora Chat
  agora_chat_sdk: ^1.4.0

  # ============================================================
  # Permissions
  # ============================================================

  permission_handler: ^11.0.1

  # ============================================================
  # Localization / Date & Time
  # ============================================================

  intl:

  # ============================================================
  # Timezone
  #
  # flutter_timezone gets the device's timezone.
  # timezone provides TZDateTime / IANA timezone database.
  #
  # timezone 0.10.x is used because Dart 3.9 cannot use 0.11.x.
  # ============================================================

  flutter_timezone: ^5.1.0
  timezone: ^0.10.1

  # ============================================================
  # Country / Region
  # ============================================================

  country_picker: ^2.0.27

dev_dependencies:
  # ============================================================
  # App / Package Configuration
  # ============================================================

  change_app_package_name: ^1.5.0
  rename_app: ^1.6.5

  # ============================================================
  # Launcher Icons
  # ============================================================

  flutter_launcher_icons: ^0.14.1

  # ============================================================
  # Testing / Linting
  # ============================================================

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ============================================================
  # Code Generation
  # ============================================================

  build_runner: ^2.4.15
  flutter_gen_runner: ^5.10.0

# ==============================================================
# Launcher Icons
# ==============================================================

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/dummy/logo.png"

  # Rename app:
  # dart run rename_app:main all="My App Name"

  # Change package name:
  # flutter pub run change_app_package_name:main com.clint_name.app_Name

# ==============================================================
# Flutter
# ==============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo/
    - assets/dummy/
